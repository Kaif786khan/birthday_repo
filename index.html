<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="hero">
    <div class="hero-content glass">
        <h1>Happy Birthday 💖</h1>
        <p>A small collection of moments, feelings, and memories.</p>
    </div>
</section>

<section class="cards-section">
    <h2 class="section-title glass">Moments</h2>

    <div class="cards-container">

        <div class="card">
            <div class="card-image" style="background-image:url('assets/images/teddy1.jpg')"></div>
            <div class="card-content">
                <h3>The First Smile</h3>
                <p>I still remember the first time I saw you smile.</p>
            </div>
        </div>

        <div class="card">
            <div class="card-image" style="background-image:url('assets/images/teddy2.jpg')"></div>
            <div class="card-content">
                <h3>Why You Matter</h3>
                <p>You make ordinary days feel lighter.</p>
            </div>
        </div>

        <div class="card">
            <div class="card-image" style="background-image:url('assets/images/teddy4.jpg')"></div>
            <div class="card-content">
                <h3>A Quiet Thank You</h3>
                <p>Thank you for being you — kind and real.</p>
            </div>
        </div>

    </div>
</section>

<script src="js/main.js"></script>
</body>
</html>
